name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools (no Gradle needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk-platform-23 aapt dalvik-exchange zipalign apksigner

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > voxcoach.keystore
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - using a throwaway key (cannot upgrade an APK already installed on your phone)"
          fi

      - name: Build
        run: bash build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: VoxCoach-apk
          path: VoxCoach.apk

      - name: Publish release (on tags like v1.2)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: VoxCoach.apk
